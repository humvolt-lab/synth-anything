<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Synth Anything &mdash; audio in synth out</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #121317;
    --panel: #1B1E24;
    --panel-2: #21252c;
    --line: #2E323B;
    --text: #EDEEF0;
    --text-dim: #8A8F98;
    --text-dimmer: #5C616B;
    --amber: #FFB020;
    --cyan: #4FD6E8;
    --magenta: #FF4FA3;
    --green: #6EE7A0;
    --red: #FF5C5C;
    --safe-t: env(safe-area-inset-top);
    --safe-b: env(safe-area-inset-bottom);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono', monospace;
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  h1,h2,h3,.display{ font-family:'Unbounded', sans-serif; }

  /* ---------- shared page shell: each top-level page is fully standalone ---------- */
  .page{
    max-width:640px; margin:0 auto; height:100vh; height:100dvh;
    display:none; flex-direction:column; overflow:hidden;
    padding-top: calc(var(--safe-t) + 8px);
    padding-bottom: calc(var(--safe-b) + 8px);
    position:relative;
  }
  .page.active{ display:flex; }

  /* ---------- init page: centered, no topbar ---------- */
  #page-init{
    justify-content:center; align-items:center; text-align:center; gap:16px;
    padding-left:24px; padding-right:24px;
  }

  /* ---------- shared chrome: rack panel look ---------- */
  .panel{
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:18px;
    position:relative;
  }
  .screw{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #55595f, #14161a);
    box-shadow: inset 0 0 1px rgba(0,0,0,.8);
  }
  .screw.tl{ top:10px; left:10px; } .screw.tr{ top:10px; right:10px; }
  .screw.bl{ bottom:10px; left:10px; } .screw.br{ bottom:10px; right:10px; }

  .page-content{ display:flex; flex:1; flex-direction:column; padding: 6px 16px 0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .eyebrow{ font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--amber); }
  h1.title{ font-size:30px; line-height:1.08; margin:6px 0 0; font-weight:900; }
  h1.title .accent{ color:var(--cyan); }
  p.lede{ color:var(--text-dim); font-size:14px; line-height:1.5; max-width:300px; margin:0; }

  .btn{
    font-family:'JetBrains Mono', monospace; font-weight:700; letter-spacing:.04em;
    border:none; border-radius:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    -webkit-user-select:none;
  }
  .btn-primary{
    background: linear-gradient(180deg, #FFC24F, var(--amber));
    color:#1a1305; padding:15px 28px; font-size:15px; margin-top:6px;
    box-shadow: 0 6px 0 #b87a10, 0 10px 20px rgba(255,176,32,.25);
  }
  .btn-primary:active{ transform: translateY(4px); box-shadow: 0 2px 0 #b87a10; }
  .btn-ghost{
    background:transparent; color:var(--text-dim); border:1px solid var(--line);
    padding:12px 20px; font-size:13px;
  }
  .mic-err{ display:none; color:var(--red); font-size:12.5px; max-width:320px; line-height:1.5; }

  /* ---------- record page ---------- */
  #recordContent{ align-items:center; justify-content:center; gap:22px; text-align:center; }
  .rec-scope-wrap{ width:100%; max-width:360px; }
  canvas#recScope{ width:100%; height:140px; display:block; }
  .rec-timer{ font-family:'Unbounded'; font-size:15px; color:var(--text-dim); letter-spacing:.06em; }
  .rec-timer .max{ color:var(--text-dimmer); }
  .rec-btn-wrap{ position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; }
  .rec-ring{
    position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--line);
  }
  .rec-ring .progress{
    position:absolute; inset:-2px; border-radius:50%;
  }
  #recBtn{
    width:108px; height:108px; border-radius:50%; border:none;
    background: radial-gradient(circle at 35% 30%, #ff7a7a, var(--red));
    box-shadow: 0 8px 0 #9a2f2f, 0 14px 26px rgba(255,92,92,.3);
    position:relative; z-index:2; transition: transform .08s;
    display:flex; align-items:center; justify-content:center;
  }
  #recBtn::after{
    content:''; display:block; width:24px; height:24px; border-radius:50%;
    background:#fff; transition: border-radius .15s, width .15s, height .15s;
  }
  #recBtn.recording{ border-radius:22px; width:70px; height:70px; }
  #recBtn.recording::after{ border-radius:5px; width:26px; height:26px; background:#1a0505; }
  #recBtn:active{ transform: translateY(4px); }
  #recBtn:disabled{ opacity:.4; }
  .rec-caption{ font-size:12.5px; color:var(--text-dim); max-width:260px; }
  .rec-caption b{ color:var(--text); }

  /* ---------- processing overlay (shown on top of the record page) ---------- */
  #processingOverlay{ align-items:center; justify-content:center; gap:18px; text-align:center; }
  .spin{
    width:46px; height:46px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--cyan);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  #procMsg{ font-size:13px; color:var(--text-dim); }

  /* ---------- performance page (single compact panel, fits one screen) ---------- */
  #performanceContent{ flex:1; display:flex; min-height:0; }
  .device-panel{ padding:8px 14px 6px; display:flex; flex-direction:column; gap:6px; flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .divider{ height:1px; background:var(--line); margin:0; }

  .transport{ display:flex; align-items:center; justify-content:center; gap:16px; }
  #playBtn{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background: linear-gradient(180deg, var(--cyan), #2fb9cc);
    box-shadow: 0 4px 0 #1c7f8c;
    color:#06272b; font-size:14px;
  }
  #playBtn:active{ transform: translateY(3px); box-shadow:0 1px 0 #1c7f8c; }
  .reset-btn{ width:34px; height:34px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); flex-shrink:0; font-size:13px; }

  /* single-line label + slider + value, used throughout to keep each
     control to one row instead of stacking a label row above it */
  .sl-label{ font-size:10px; color:var(--text-dim); flex-shrink:0; width:56px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sl-val{ font-size:10px; color:var(--text); font-weight:700; flex-shrink:0; min-width:34px; text-align:right; white-space:nowrap; }
  .slider-inline{ display:flex; align-items:center; gap:8px; }
  .slider-inline input[type=range]{ flex:1; min-width:0; }

  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:24px; background:transparent; margin:0;
    display:flex; align-items:center;
  }
  input[type=range]::-webkit-slider-runnable-track{ height:5px; border-radius:3px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%;
    background: var(--track-color, var(--cyan)); margin-top:-8.5px;
    border:2.5px solid #101216; box-shadow:0 2px 6px rgba(0,0,0,.5);
  }

  .section-title{ display:flex; align-items:center; gap:6px; font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-dim); margin-bottom:1px; }
  .section-title .swatch{ width:7px; height:7px; border-radius:2px; }

  .row-3col{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }

  .cycle-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:7px 3px; border-radius:9px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); font-family:'JetBrains Mono', monospace; font-size:10.5px; font-weight:700;
    white-space:nowrap; overflow:hidden;
  }
  .cycle-btn svg{ display:block; flex-shrink:0; }
  .cycle-btn span:not(.cyc-hint){ overflow:hidden; text-overflow:ellipsis; }
  .cycle-btn .cyc-hint{ color:var(--text-dimmer); font-size:11px; margin-left:1px; flex-shrink:0; }
  .cycle-btn:active{ transform: translateY(1px); }

  .weights-grid{ display:flex; flex-direction:column; gap:4px; }
  .weight-item{ display:flex; align-items:center; gap:6px; }
  .weight-item .wi-label{ display:flex; align-items:center; gap:5px; font-size:10px; color:var(--text-dim); flex-shrink:0; width:46px; white-space:nowrap; overflow:hidden; }
  .weight-item .wi-label .swatch{ width:7px; height:7px; border-radius:2px; flex-shrink:0; }
  .weight-item input[type=range]{ flex:1; min-width:0; }
  .dice-btn{
    width:20px; height:20px; padding:3px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel-2); display:flex;
    align-items:center; justify-content:center; flex-shrink:0; transition:transform .12s;
  }
  .dice-btn svg{ width:100%; height:100%; display:block; }
  .dice-btn:active{ transform: scale(0.82) rotate(18deg); }


  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>

<!-- ============ INIT PAGE ============ -->
<div class="page active" id="page-init">
  <h1 class="title">SYNTH ANYTHING</h1>
  <p class="lede">audio in &mdash; synth out</p>
  <button class="btn btn-primary" id="enableMicBtn">Enable microphone</button>
  <div class="mic-err" id="micErr"></div>
</div>

<!-- ============ RECORDING PAGE ============ -->
<div class="page" id="page-record">
  <div class="page-content" id="recordContent">
    <div class="rec-scope-wrap panel">
      <canvas id="recScope"></canvas>
    </div>
    <div class="rec-timer"><span id="recTime">0.0</span><span class="max">s / 8.0s</span></div>
    <div class="rec-btn-wrap">
      <div class="rec-ring"><svg class="progress" id="recProgress" viewBox="0 0 150 150"></svg></div>
      <button id="recBtn"></button>
    </div>
    <div class="rec-caption" id="recCaption">Tap the button and make some noise &mdash; hum, tap a beat, play an instrument. Tap again to stop early, or it'll cut at <b>8s</b>.</div>
  </div>
  <div class="page-content processing-overlay" id="processingOverlay" style="display:none;">
    <div class="spin"></div>
    <div id="procMsg">Listening back&hellip;</div>
  </div>
</div>

<!-- ============ PERFORMANCE PAGE ============ -->
<div class="page" id="page-performance">
  <div class="page-content" id="performanceContent">
    <div class="device-panel panel">

      <div class="transport">
        <button class="btn" id="playBtn">&#9654;</button>
        <button class="reset-btn" id="reRecordBtn" title="Re-record">&#8634;</button>
      </div>

      <div class="slider-inline">
        <span class="sl-label">Tempo</span>
        <input type="range" id="bpmSlider" min="40" max="220" value="100" style="--track-color: var(--amber);">
        <span class="sl-val"><span id="bpmVal">100</span>bpm</span>
      </div>

      <div class="divider"></div>

      <div class="slider-inline">
        <span class="sl-label">Orig/Synth</span>
        <input type="range" id="mixSlider" min="0" max="100" value="100" style="--track-color: var(--green);">
        <span class="sl-val"><span id="mixVal">100</span>%</span>
      </div>

      <div class="row-3col">
        <div>
          <div class="section-title"><span class="swatch" style="background:var(--green)"></span>Style</div>
          <button class="cycle-btn" id="styleBtn"></button>
        </div>
        <div>
          <div class="section-title"><span class="swatch" style="background:var(--green)"></span>Wave</div>
          <button class="cycle-btn" id="waveBtn"></button>
        </div>
        <div>
          <div class="section-title"><span class="swatch" style="background:var(--cyan)"></span>Filter</div>
          <button class="cycle-btn" id="filterBtn"></button>
        </div>
      </div>

      <div class="slider-inline">
        <span class="sl-label">Cutoff</span>
        <input type="range" id="cutoffSlider" min="0" max="100" value="50" style="--track-color: var(--cyan);">
        <span class="sl-val"><span id="cutoffVal">1200</span>Hz</span>
      </div>
      <div class="slider-inline">
        <span class="sl-label">Resonance</span>
        <input type="range" id="resSlider" min="1" max="200" value="10" style="--track-color: var(--cyan);">
        <span class="sl-val"><span id="resVal">1.0</span></span>
      </div>

      <div class="divider"></div>

      <div class="weights-grid">
        <div class="weight-item">
          <span class="wi-label"><span class="swatch" style="background:var(--green)"></span>Synth</span>
          <input type="range" id="wSynth" min="0" max="100" value="80" style="--track-color: var(--green);">
          <button class="dice-btn" data-lane="note" style="color:var(--green)" aria-label="Reinterpret synth"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="4.5" r="1.15" fill="currentColor"/><circle cx="11" cy="4.5" r="1.15" fill="currentColor"/><circle cx="5" cy="8" r="1.15" fill="currentColor"/><circle cx="11" cy="8" r="1.15" fill="currentColor"/><circle cx="5" cy="11.5" r="1.15" fill="currentColor"/><circle cx="11" cy="11.5" r="1.15" fill="currentColor"/></svg></button>
        </div>
        <div class="weight-item">
          <span class="wi-label"><span class="swatch" style="background:var(--amber)"></span>Kick</span>
          <input type="range" id="wKick" min="0" max="100" value="90" style="--track-color: var(--amber);">
          <button class="dice-btn" data-lane="kick" style="color:var(--amber)" aria-label="Reinterpret kick"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="4.5" r="1.15" fill="currentColor"/><circle cx="11" cy="4.5" r="1.15" fill="currentColor"/><circle cx="5" cy="8" r="1.15" fill="currentColor"/><circle cx="11" cy="8" r="1.15" fill="currentColor"/><circle cx="5" cy="11.5" r="1.15" fill="currentColor"/><circle cx="11" cy="11.5" r="1.15" fill="currentColor"/></svg></button>
        </div>
        <div class="weight-item">
          <span class="wi-label"><span class="swatch" style="background:var(--magenta)"></span>Snare</span>
          <input type="range" id="wSnare" min="0" max="100" value="75" style="--track-color: var(--magenta);">
          <button class="dice-btn" data-lane="snare" style="color:var(--magenta)" aria-label="Reinterpret snare"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="4.5" r="1.15" fill="currentColor"/><circle cx="11" cy="4.5" r="1.15" fill="currentColor"/><circle cx="5" cy="8" r="1.15" fill="currentColor"/><circle cx="11" cy="8" r="1.15" fill="currentColor"/><circle cx="5" cy="11.5" r="1.15" fill="currentColor"/><circle cx="11" cy="11.5" r="1.15" fill="currentColor"/></svg></button>
        </div>
        <div class="weight-item">
          <span class="wi-label"><span class="swatch" style="background:var(--cyan)"></span>Hi&#8209;hat</span>
          <input type="range" id="wHihat" min="0" max="100" value="65" style="--track-color: var(--cyan);">
          <button class="dice-btn" data-lane="hihat" style="color:var(--cyan)" aria-label="Reinterpret hi-hat"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="4.5" r="1.15" fill="currentColor"/><circle cx="11" cy="4.5" r="1.15" fill="currentColor"/><circle cx="5" cy="8" r="1.15" fill="currentColor"/><circle cx="11" cy="8" r="1.15" fill="currentColor"/><circle cx="5" cy="11.5" r="1.15" fill="currentColor"/><circle cx="11" cy="11.5" r="1.15" fill="currentColor"/></svg></button>
        </div>
      </div>
      <div class="slider-inline">
        <span class="sl-label">Sensitivity</span>
        <input type="range" id="sensSlider" min="5" max="95" value="35" style="--track-color: var(--magenta);">
        <span class="sl-val"><span id="sensVal">35</span>%</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= utility ================= */
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function midiToFreq(m){ return 440 * Math.pow(2,(m-69)/12); }
function freqToMidi(f){ return 69 + 12*Math.log2(f/440); }
function $(id){ return document.getElementById(id); }

/* ================= page management ================= */
const pages = ['page-init','page-record','page-performance'];
function showPage(id){
  pages.forEach(p => $(p).classList.toggle('active', p===id));
  if (id === 'page-record' && !recScopeRAF) startRecScopeLoop();
}
function showProcessing(isProcessing){
  $('recordContent').style.display = isProcessing ? 'none' : 'flex';
  $('processingOverlay').style.display = isProcessing ? 'flex' : 'none';
}

/* ================= audio context / mic ================= */
let audioCtx = null;
let micStream = null;
let sourceNode = null;
let analyserNode = null; // for live scope while recording
let processorNode = null;
let recordedChunks = [];
let recordedSampleRate = 44100;

async function acquireMic(){
  micStream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:true } });
  if (!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    recordedSampleRate = audioCtx.sampleRate;
  }
  sourceNode = audioCtx.createMediaStreamSource(micStream);
  analyserNode = audioCtx.createAnalyser();
  analyserNode.fftSize = 1024;
  sourceNode.connect(analyserNode);
}

// Stops the actual mic tracks (not just disconnecting nodes). On iOS Safari,
// simply holding a live getUserMedia stream keeps the audio session pinned
// in a recording-capable mode for as long as the page is open, which blocks
// or downgrades Bluetooth output the whole time. Releasing the hardware the
// moment we're done recording lets Bluetooth playback work normally again
// while you're editing/performing the loop.
function releaseMic(){
  if (micStream){
    micStream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} });
  }
  micStream = null;
  if (sourceNode){ try{ sourceNode.disconnect(); }catch(e){} }
  sourceNode = null;
}

async function enableMic(){
  const btn = $('enableMicBtn');
  const err = $('micErr');
  err.style.display = 'none';
  btn.textContent = 'Requesting access\u2026';
  try{
    await acquireMic();
    showPage('page-record');
  }catch(e){
    btn.textContent = 'Enable microphone';
    err.style.display = 'block';
    if (e && (e.name==='NotAllowedError' || e.name==='SecurityError')){
      err.textContent = "Microphone access was blocked. Check your browser's site settings and allow microphone access, then try again.";
    } else if (e && e.name==='NotFoundError'){
      err.textContent = 'No microphone was found on this device.';
    } else {
      err.textContent = 'Could not access the microphone (' + (e && e.message ? e.message : 'unknown error') + '). Try again.';
    }
  }
}
$('enableMicBtn').addEventListener('click', enableMic);

/* ================= recording ================= */
const MAX_RECORD_SEC = 8;
let isRecording = false;
let recordStartTime = 0;
let recordTimerRAF = null;

function startRecording(){
  if (!audioCtx || !sourceNode || isRecording) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  recordedChunks = [];
  isRecording = true;
  recordStartTime = audioCtx.currentTime;

  const bufferSize = 4096;
  processorNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);
  processorNode.onaudioprocess = function(e){
    if (!isRecording) return;
    const input = e.inputBuffer.getChannelData(0);
    recordedChunks.push(new Float32Array(input));
  };
  sourceNode.connect(processorNode);
  // ScriptProcessorNode needs a sink to fire onaudioprocess in all browsers,
  // so route it through a silent gain instead of straight to destination
  // (avoids the user hearing their own mic feedback while recording).
  const silentGain = audioCtx.createGain();
  silentGain.gain.value = 0;
  processorNode.connect(silentGain);
  silentGain.connect(audioCtx.destination);

  $('recBtn').classList.add('recording');
  $('recCaption').textContent = 'Recording\u2026 tap to stop.';
  tickRecordTimer();
}

function stopRecording(){
  if (!isRecording) return;
  isRecording = false;
  $('recBtn').classList.remove('recording');
  if (recordTimerRAF) cancelAnimationFrame(recordTimerRAF);
  try{ sourceNode.disconnect(processorNode); }catch(e){}
  try{ processorNode.disconnect(); }catch(e){}

  let total = 0;
  recordedChunks.forEach(c => total += c.length);
  const samples = new Float32Array(total);
  let off = 0;
  recordedChunks.forEach(c => { samples.set(c, off); off += c.length; });
  recordedChunks = [];

  if (samples.length < recordedSampleRate * 0.3){
    $('recCaption').textContent = 'That was too short \u2014 try holding it for at least a second.';
    return;
  }

  // We have the audio we need — release the mic right away so Bluetooth
  // output isn't held hostage for the rest of the session.
  releaseMic();

  const normalized = normalizeSamples(samples);
  showProcessing(true);
  setTimeout(() => runAnalysis(normalized, recordedSampleRate), 60);
}

function tickRecordTimer(){
  if (!isRecording) return;
  const elapsed = audioCtx.currentTime - recordStartTime;
  $('recTime').textContent = elapsed.toFixed(1);
  const pct = clamp(elapsed / MAX_RECORD_SEC, 0, 1);
  drawRecProgress(pct);
  if (elapsed >= MAX_RECORD_SEC){
    stopRecording();
    return;
  }
  recordTimerRAF = requestAnimationFrame(tickRecordTimer);
}

$('recBtn').addEventListener('click', function(){
  if (isRecording) stopRecording(); else startRecording();
});
$('reRecordBtn').addEventListener('click', async function(){
  stopPlayback();
  showProcessing(false);
  showPage('page-record');
  $('recTime').textContent = '0.0';
  drawRecProgress(0);

/* ---- scopes (canvas oscilloscope visuals) ---- */
function setupCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: rect.height };
}


let recScopeRAF = null;
function startRecScopeLoop(){
  const canvas = $('recScope');
  const {ctx, w, h} = setupCanvas(canvas);
  const data = new Uint8Array(analyserNode.fftSize);
  function draw(){
    analyserNode.getByteTimeDomainData(data);
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = isRecording ? '#FF5C5C' : '#4FD6E8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const step = w / data.length;
    const visualBoost = 2.4; // amplify on-screen only, for feedback on quiet mics
    for (let i=0;i<data.length;i++){
      const v = clamp((data[i]/128 - 1) * visualBoost, -1, 1);
      const y = h/2 + v*(h/2-6);
      const x = i*step;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    recScopeRAF = requestAnimationFrame(draw);
  }
  draw();
}

/* ================= ANALYSIS ================= */
const RES = 64; // fixed internal analysis resolution, downsampled to step count later

function normalizeSamples(samples){
  let peak = 0;
  for (let i=0;i<samples.length;i++){ const a = Math.abs(samples[i]); if (a>peak) peak = a; }
  if (peak < 0.0008) return samples; // essentially silent, don't blow up noise floor
  const targetPeak = 0.9;
  const gain = Math.min(targetPeak/peak, 18);
  if (gain <= 1.05) return samples; // already loud enough
  for (let i=0;i<samples.length;i++) samples[i] = clamp(samples[i]*gain, -1, 1);
  return samples;
}

function zeroCrossingRate(buf){
  let z = 0;
  for (let i=1;i<buf.length;i++){ if ((buf[i]>=0) !== (buf[i-1]>=0)) z++; }
  return z / buf.length;
}

function bandEnergies(buf, sampleRate){
  const fcLow = 150, fcHigh = 4000;
  const dt = 1/sampleRate;
  const rcLow = 1/(2*Math.PI*fcLow);
  const rcHigh = 1/(2*Math.PI*fcHigh);
  const aLow = dt/(rcLow+dt);
  const aHigh = rcHigh/(rcHigh+dt);
  let lpPrev = 0, hpPrevIn = 0, hpPrevOut = 0;
  let low=0, high=0, total=0;
  for (let i=0;i<buf.length;i++){
    const s = buf[i];
    total += s*s;
    lpPrev = lpPrev + aLow*(s-lpPrev);
    low += lpPrev*lpPrev;
    const hpOut = aHigh*(hpPrevOut + s - hpPrevIn);
    hpPrevIn = s; hpPrevOut = hpOut;
    high += hpOut*hpOut;
  }
  const mid = Math.max(0, total-low-high);
  return { low, mid, high, total };
}

function detectOnsets(samples, sampleRate){
  const frameSize = 1024, hop = 512;
  const energies = [];
  for (let i=0; i+frameSize<=samples.length; i+=hop){
    let sum = 0;
    for (let j=0;j<frameSize;j++){ const v = samples[i+j]; sum += v*v; }
    energies.push(Math.sqrt(sum/frameSize));
  }
  const flux = [0];
  for (let i=1;i<energies.length;i++) flux.push(Math.max(0, energies[i]-energies[i-1]));
  const mean = flux.reduce((a,b)=>a+b,0) / (flux.length||1);
  const variance = flux.reduce((a,b)=>a+(b-mean)*(b-mean),0) / (flux.length||1);
  const std = Math.sqrt(variance);
  const threshold = mean + std*1.15;
  const minGapFrames = Math.max(1, Math.round((sampleRate*0.08)/hop));
  const onsets = [];
  let lastFrame = -1000;
  for (let i=1;i<flux.length;i++){
    if (flux[i] > threshold && flux[i] >= flux[i-1] && energies[i] > 0.012 && (i-lastFrame) > minGapFrames){
      onsets.push({ time: (i*hop)/sampleRate, sampleIndex: i*hop });
      lastFrame = i;
    }
  }
  return onsets;
}

function classifyOnset(samples, sampleRate, onset){
  const winLen = Math.min(1024, samples.length - onset.sampleIndex);
  if (winLen <= 0) return null;
  const win = samples.subarray(onset.sampleIndex, onset.sampleIndex+winLen);
  const { low, mid, high, total } = bandEnergies(win, sampleRate);
  const zcr = zeroCrossingRate(win);
  let type = 'snare';
  if (low >= mid && low >= high) type = 'kick';
  else if (zcr > 0.15 && high >= mid) type = 'hihat';
  else type = 'snare';
  const velocity = clamp(Math.sqrt(total/winLen) * 7, 0.05, 1);
  return { type, velocity, sampleIndex: onset.sampleIndex, time: onset.time };
}

function estimateBPM(onsets){
  if (onsets.length < 2) return 100;
  const iois = [];
  for (let i=1;i<onsets.length;i++){
    const d = onsets[i].time - onsets[i-1].time;
    if (d > 0.12 && d < 2.2) iois.push(d);
  }
  if (!iois.length) return 100;
  iois.sort((a,b)=>a-b);
  const median = iois[Math.floor(iois.length/2)];
  return 60/median; // raw, unfolded -- caller decides how to fit this to a display range
}

/* Instead of picking a bpm purely from onset spacing (which almost never
   lines up with the actual recorded length) and then forcing the audio to
   stretch/compress to match, work the other way: find the bpm that makes
   the WHOLE recording exactly some whole number of bars (1, 2, 4, or 8),
   trying each option and keeping whichever lands closest to the felt
   tempo from onset spacing. That way the initial loop needs zero
   time-manipulation to play back -- it already IS the recording -- and
   the step sequencer's bar length is what syncs up to it, not the other
   way around. */
function deriveNativeTempo(duration, onsets){
  const rawBpm = estimateBPM(onsets);
  const candidates = [1,2,4,8];
  let best = { bars:1, bpm: clamp(240/duration, 40, 220) };
  let bestScore = Infinity;
  candidates.forEach(bars => {
    const candidateBpm = 240*bars/duration;
    if (candidateBpm < 40 || candidateBpm > 220) return;
    const score = Math.abs(Math.log2(candidateBpm/rawBpm));
    if (score < bestScore){ bestScore = score; best = { bars, bpm: candidateBpm }; }
  });
  return { bpm: Math.round(best.bpm), bars: best.bars };
}

function autoCorrelate(buf, sampleRate){
  const SIZE = buf.length;
  let rms = 0;
  for (let i=0;i<SIZE;i++) rms += buf[i]*buf[i];
  rms = Math.sqrt(rms/SIZE);
  if (rms < 0.010) return { freq:-1, rms };

  let r1=0, r2=SIZE-1;
  const thres = 0.2;
  for (let i=0;i<SIZE/2;i++){ if (Math.abs(buf[i])<thres){ r1=i; break; } }
  for (let i=1;i<SIZE/2;i++){ if (Math.abs(buf[SIZE-i])<thres){ r2=SIZE-i; break; } }
  const trimmed = buf.slice(r1,r2);
  const n = trimmed.length;
  if (n < 8) return { freq:-1, rms };
  const c = new Float32Array(n);
  for (let i=0;i<n;i++){
    let sum = 0;
    for (let j=0;j<n-i;j++) sum += trimmed[j]*trimmed[j+i];
    c[i] = sum;
  }
  let d = 0; while (d < n-1 && c[d] > c[d+1]) d++;
  let maxVal=-1, maxPos=-1;
  for (let i=d;i<n;i++){ if (c[i] > maxVal){ maxVal = c[i]; maxPos = i; } }
  if (maxPos <= 0) return { freq:-1, rms };
  let T0 = maxPos;
  if (T0 > 0 && T0 < n-1){
    const x1=c[T0-1], x2=c[T0], x3=c[T0+1];
    const a = (x1+x3-2*x2)/2, b=(x3-x1)/2;
    if (a) T0 = T0 - b/(2*a);
  }
  if (T0 <= 0) return { freq:-1, rms };
  return { freq: sampleRate/T0, rms };
}

function fftInPlace(re, im){
  const n = re.length;
  for (let i=1,j=0;i<n;i++){
    let bit = n>>1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){
      let tr = re[i]; re[i]=re[j]; re[j]=tr;
      let ti = im[i]; im[i]=im[j]; im[j]=ti;
    }
  }
  for (let len=2; len<=n; len<<=1){
    const ang = -2*Math.PI/len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i=0;i<n;i+=len){
      let curWr=1, curWi=0;
      for (let j=0;j<len/2;j++){
        const ur = re[i+j], ui = im[i+j];
        const vr = re[i+j+len/2]*curWr - im[i+j+len/2]*curWi;
        const vi = re[i+j+len/2]*curWi + im[i+j+len/2]*curWr;
        re[i+j] = ur+vr; im[i+j] = ui+vi;
        re[i+j+len/2] = ur-vr; im[i+j+len/2] = ui-vi;
        const nwr = curWr*wr - curWi*wi;
        const nwi = curWr*wi + curWi*wr;
        curWr = nwr; curWi = nwi;
      }
    }
  }
}

function spectralCentroidAt(samples, sampleRate, centerSample){
  const N = 2048;
  const start = clamp(centerSample - N/2, 0, Math.max(0, samples.length-N));
  const re = new Float64Array(N), im = new Float64Array(N);
  for (let i=0;i<N;i++){
    const s = samples[start+i] || 0;
    const w = 0.5 - 0.5*Math.cos(2*Math.PI*i/(N-1));
    re[i] = s*w;
  }
  fftInPlace(re, im);
  let num=0, den=0;
  for (let i=1;i<N/2;i++){
    const mag = Math.sqrt(re[i]*re[i]+im[i]*im[i]);
    const freq = i*sampleRate/N;
    num += freq*mag; den += mag;
  }
  return den > 0 ? num/den : 1500;
}

function analyzeAudio(samples, sampleRate){
  const duration = samples.length / sampleRate;

  const onsets = detectOnsets(samples, sampleRate);
  const drumHits = onsets.map(o => classifyOnset(samples, sampleRate, o)).filter(Boolean);
  const native = deriveNativeTempo(duration, onsets);
  const bpm = native.bpm;

  const sliceLen = Math.max(1, Math.floor(samples.length / RES));
  const noteSlices = [];
  for (let i=0;i<RES;i++){
    const start = i*sliceLen;
    const windowLen = Math.min(sliceLen, 2048);
    const wStart = clamp(start + Math.floor((sliceLen-windowLen)/2), 0, Math.max(0,samples.length-windowLen));
    const win = samples.subarray(wStart, wStart+windowLen);
    const { freq, rms } = autoCorrelate(win, sampleRate);
    if (freq > 60 && freq < 1200 && rms > 0.009){
      noteSlices.push({ hasNote:true, midi: Math.round(freqToMidi(freq)), velocity: clamp(rms*9, 0.05, 1) });
    } else {
      noteSlices.push({ hasNote:false, midi:0, velocity:0 });
    }
  }

  const drumSlices = [];
  for (let i=0;i<RES;i++) drumSlices.push({ kick:0, snare:0, hihat:0 });
  drumHits.forEach(h => {
    const idx = clamp(Math.floor(h.sampleIndex / sliceLen), 0, RES-1);
    drumSlices[idx][h.type] = Math.max(drumSlices[idx][h.type], h.velocity);
  });

  let centroidSum = 0, centroidN = 0;
  [0.2,0.5,0.8].forEach(frac => {
    centroidSum += spectralCentroidAt(samples, sampleRate, Math.floor(samples.length*frac));
    centroidN++;
  });
  const centroid = centroidSum / centroidN;
  const suggestedCutoff = clamp(centroid * 2.1, 350, 14000);
  const zcrAvg = zeroCrossingRate(samples);
  let suggestedWave = 'sine';
  if (zcrAvg > 0.16) suggestedWave = 'sawtooth';
  else if (zcrAvg > 0.095) suggestedWave = 'square';
  else if (zcrAvg > 0.045) suggestedWave = 'triangle';

  return { bpm, nativeBars: native.bars, noteSlices, drumSlices, suggestedCutoff, suggestedWave, duration, RES,
    onsetTimes: onsets.map(o => o.time),
    noteTimes: noteSlices.map((n,i) => n.hasNote ? (i+0.5)/RES*duration : null).filter(t => t !== null) };
}

/* ================= state ================= */
let lastAnalysis = null;
let stepCount = 16;
let steps = []; // array of {note:{midi,vel}|null, kick, snare, hihat, kOn,sOn,hOn,nOn}
let params = {
  bpm: 100,
  waveform: 'sine',
  synthStyle: 'percussive',
  filterType: 'lowpass',
  cutoff: 1200,
  resonance: 1,
  wSynth: 0.8, wKick: 0.9, wSnare: 0.75, wHihat: 0.65,
  sensitivity: 0.35,
  mix: 1.0 // 1 = full synth, 0 = full original recording; drums are unaffected
};

function buildStepsFromAnalysis(analysis, count){
  const groupSize = analysis.RES / count;
  const out = [];
  for (let s=0;s<count;s++){
    const from = Math.floor(s*groupSize), to = Math.floor((s+1)*groupSize);
    let bestNote = null;
    for (let i=from;i<to;i++){
      const n = analysis.noteSlices[i];
      if (n.hasNote && (!bestNote || n.velocity > bestNote.velocity)) bestNote = n;
    }
    let kick=0, snare=0, hihat=0;
    for (let i=from;i<to;i++){
      const d = analysis.drumSlices[i];
      kick = Math.max(kick, d.kick);
      snare = Math.max(snare, d.snare);
      hihat = Math.max(hihat, d.hihat);
    }
    out.push({
      note: bestNote ? { midi: bestNote.midi, vel: bestNote.velocity } : null,
      kick, snare, hihat
    });
  }
  applyThresholds(out);
  completeDrumPattern(out, count);
  return out;
}

function applyThresholds(arr){
  const thr = params.sensitivity; // 0..1, higher = stricter
  arr.forEach(st => {
    st.nOn = !!(st.note && st.note.vel >= thr*0.9);
    st.kOn = st.kick >= thr;
    st.sOn = st.snare >= thr;
    st.hOn = st.hihat >= thr;
  });
}

/* If a beat was picked up at all but only 1 or 2 of {kick, snare, hihat}
   actually got hits, fill in the missing element(s) with a complementary
   pattern (kick on 1 & 3, snare backbeat on 2 & 4, steady 8th-note hihat)
   so the loop still feels like a full drum part. If nothing rhythmic was
   detected at all, leave it silent rather than inventing a beat from thin air. */
function completeDrumPattern(arr, count){
  const hasKick = arr.some(s => s.kOn);
  const hasSnare = arr.some(s => s.sOn);
  const hasHihat = arr.some(s => s.hOn);
  const presentCount = [hasKick, hasSnare, hasHihat].filter(Boolean).length;
  if (presentCount === 0 || presentCount === 3) return;

  function setHit(fraction, type, vel){
    const idx = ((Math.round(fraction*count) % count) + count) % count;
    const st = arr[idx];
    if (type === 'kick'){ st.kOn = true; st.kick = Math.max(st.kick, vel); }
    if (type === 'snare'){ st.sOn = true; st.snare = Math.max(st.snare, vel); }
    if (type === 'hihat'){ st.hOn = true; st.hihat = Math.max(st.hihat, vel); }
  }

  if (!hasKick){
    setHit(0, 'kick', 0.75);
    setHit(0.5, 'kick', 0.7);
  }
  if (!hasSnare){
    setHit(0.25, 'snare', 0.65);
    setHit(0.75, 'snare', 0.65);
  }
  if (!hasHihat){
    const hatEvery = Math.max(1, Math.round(count/8));
    for (let i=0;i<count;i+=hatEvery){
      setHit(i/count, 'hihat', (i % (hatEvery*2)===0) ? 0.55 : 0.4);
    }
  }
}

/* Dice buttons: reinterpret one instrument lane at a time by nudging its
   current pattern -- flip a handful of steps on/off, and for the synth
   lane also give some notes a small random pitch shift. This is a "roll
   again, a little differently" tool, not a fresh analysis, so it stays
   grounded in the existing pattern rather than replacing it outright. */
function rerollLane(laneKey){
  if (!steps || !steps.length) return;
  const onKey = laneKey === 'note' ? 'nOn' : laneKey === 'kick' ? 'kOn' : laneKey === 'snare' ? 'sOn' : 'hOn';
  steps.forEach(st => {
    if (Math.random() < 0.22) st[onKey] = !st[onKey];
  });
  if (laneKey === 'note'){
    const shifts = [-2,-1,1,2];
    steps.forEach(st => {
      if (st.nOn && st.note && Math.random() < 0.35){
        const shift = shifts[Math.floor(Math.random()*shifts.length)];
        st.note = { midi: st.note.midi + shift, vel: st.note.vel };
      }
    });
  }
}
document.querySelectorAll('.dice-btn').forEach(btn => {
  btn.addEventListener('click', () => rerollLane(btn.dataset.lane));
});

/* ================= run full analysis -> editor ================= */
function runAnalysis(samples, sampleRate){
  $('procMsg').textContent = 'Finding pitch, beat & tone\u2026';
  setTimeout(() => {
    try{
      lastAnalysis = analyzeAudio(samples, sampleRate);
      params.bpm = clamp(lastAnalysis.bpm, 40, 220);
      params.waveform = lastAnalysis.suggestedWave;
      params.cutoff = lastAnalysis.suggestedCutoff;
      stepCount = 16;
      steps = buildStepsFromAnalysis(lastAnalysis, stepCount);
      syncUIToParams();
      showProcessing(false);
      showPage('page-performance');
      storeRecordedSamples(samples, sampleRate);
    }catch(e){
      $('procMsg').textContent = 'Analysis hit a snag \u2014 try recording again.';
      setTimeout(() => { showProcessing(false); showPage('page-record'); }, 1400);
    }
  }, 50);
}

/* Fit the original recording to the current tempo WITHOUT time-stretching,
   built around the actual points the analysis identified as notes or
   beats -- not an artificial uniform grid. At each reference point, grab
   a 32nd-note-length grain (measured at the recording's own native tempo)
   starting right there, and sample-and-hold (repeat) that grain until the
   NEXT reference point is reached. Then grab a fresh grain at that point
   and repeat the process. The gaps between reference points are scaled to
   fit the current target duration (so the whole thing speeds up or slows
   down together with the tempo), but the grains themselves always come
   straight from the source audio at their native length -- no stretching,
   just classic sample-and-hold retriggered at the real rhythmic/melodic
   anchor points of the recording. */
function chopFitAudioToBar(samples, sampleRate, refTimes, targetDuration, nativeBpm){
  const totalSamples = samples.length;
  const nativeDuration = totalSamples/sampleRate;
  const targetSamples = Math.max(1, Math.round(targetDuration*sampleRate));
  const scaleFactor = targetDuration/nativeDuration;

  const grainSamples = Math.max(2, Math.round(((240/nativeBpm)/32) * sampleRate));

  // reference points = every place a note or beat was actually
  // interpreted from this recording, deduped if too close together
  let points = (refTimes||[]).filter(t => t>0.01 && t<nativeDuration-0.01).sort((a,b)=>a-b);
  const merged = [];
  points.forEach(t => { if (!merged.length || t-merged[merged.length-1] > 0.03) merged.push(t); });
  const boundaries = [0, ...merged, nativeDuration]; // native-timeline reference points
  const switchPoints = boundaries.map(t => Math.round(t*scaleFactor*sampleRate)); // same points, output-sample positions

  // Precompute one Hann window and place overlapping (50% hop) windowed
  // copies across the ENTIRE output buffer on a single continuous grid --
  // not restarted at each reference point. Which reference point's audio
  // a given grain is sourced from switches as the grid crosses a switch
  // point, but the window placement itself never resets, so two grains
  // straddling a note/beat boundary overlap and sum together exactly like
  // any other pair of neighboring grains. That removes the periodic dip
  // to near-silence that a hard per-segment reset would otherwise cause
  // at every single reference point, while the constant-overlap-add
  // property of a 50%-hop Hann window keeps the sustained hold sections
  // click-free too.
  const win = new Float32Array(grainSamples);
  for (let k=0;k<grainSamples;k++) win[k] = 0.5 - 0.5*Math.cos(2*Math.PI*k/(grainSamples-1));

  const out = new Float32Array(targetSamples);
  const hop = Math.max(1, Math.round(grainSamples*0.5));
  let segIdx = 0;

  for (let pos=0; pos<targetSamples; pos+=hop){
    while (segIdx < switchPoints.length-2 && pos >= switchPoints[segIdx+1]) segIdx++;
    const grainStart = Math.round(boundaries[segIdx]*sampleRate);
    const grainLen = Math.min(grainSamples, totalSamples-grainStart);
    if (grainLen < 2) continue;
    const copyLen = Math.min(grainLen, targetSamples-pos);
    for (let k=0;k<copyLen;k++) out[pos+k] += samples[grainStart+k]*win[k];
  }

  // taper both ends toward silence so the loop wraps without a click
  const edgeFade = Math.min(Math.round(sampleRate*0.006), Math.floor(targetSamples/6));
  for (let i=0;i<edgeFade;i++){
    const g = i/edgeFade;
    out[i] *= g;
    out[targetSamples-1-i] *= g;
  }

  return out;
}

function buildFittedRecordedBuffer(){
  if (!audioCtx || !lastSamplesForRedraw || !lastAnalysis) return null;
  const bars = lastAnalysis.nativeBars || 1;
  const targetDuration = bars * (240/params.bpm); // spans the same number of bars the recording naturally represents
  const nativeBpm = clamp(lastAnalysis.bpm || 100, 40, 220);
  const refTimes = [...(lastAnalysis.onsetTimes||[]), ...(lastAnalysis.noteTimes||[])];
  const fitted = chopFitAudioToBar(lastSamplesForRedraw, lastSampleRateForRedraw, refTimes, targetDuration, nativeBpm);
  const buf = audioCtx.createBuffer(1, fitted.length, lastSampleRateForRedraw);
  buf.copyToChannel(fitted, 0);
  return buf;
}

let lastSamplesForRedraw = null, lastSampleRateForRedraw = 44100;
function storeRecordedSamples(samples, sampleRate){
  lastSamplesForRedraw = samples; lastSampleRateForRedraw = sampleRate;
}

/* ================= style / waveform / filter cycle buttons ================= */
const SYNTH_STYLES = [
  { key:'percussive', label:'Pluck' },
  { key:'phrased', label:'Phrased' },
  { key:'flowing', label:'Flowing' }
];
const WAVEFORMS = [
  { key:'sine', label:'Sine', path:'M1 8 Q 7 1 13 8 T 25 8' },
  { key:'triangle', label:'Tri', path:'M1 8 L7 1 L19 15 L25 8' },
  { key:'sawtooth', label:'Saw', path:'M1 14 L1 2 L13 14 L13 2 L25 14' },
  { key:'square', label:'Sqr', path:'M1 2 L1 14 L13 14 L13 2 L25 2 L25 14' }
];
const FILTER_TYPES = [
  { key:'lowpass', label:'LP' },
  { key:'highpass', label:'HP' },
  { key:'bandpass', label:'BP' }
];

/* Different waveforms and playing styles carry very different amounts of
   perceived loudness at the same nominal gain -- a sine sounds much
   quieter than a sawtooth or square at identical amplitude because it has
   almost no harmonic energy, and a continuous "flowing" mono voice reads
   as far louder than short plucked notes simply because it's sounding
   nearly all the time instead of decaying quickly. These tables correct
   for that so switching waveform or style doesn't also silently change
   the overall volume. Sine and Pluck are left at 1.0 as the reference
   points (the quietest of each set); everything else is pulled down to
   roughly match rather than boosted up, to avoid any new clipping risk. */
const WAVEFORM_GAIN = { sine: 1.0, triangle: 0.72, sawtooth: 0.42, square: 0.38 };
const STYLE_GAIN = { percussive: 1.0, phrased: 0.8, flowing: 0.34 };
function synthLoudnessGain(){
  return (WAVEFORM_GAIN[params.waveform] || 1) * (STYLE_GAIN[params.synthStyle] || 1);
}

function renderStyleBtn(){
  const s = SYNTH_STYLES.find(x => x.key === params.synthStyle) || SYNTH_STYLES[0];
  $('styleBtn').innerHTML = '<span>'+s.label+'</span><span class="cyc-hint">&#8635;</span>';
}
function renderWaveBtn(){
  const w = WAVEFORMS.find(x => x.key === params.waveform) || WAVEFORMS[0];
  $('waveBtn').innerHTML = '<svg viewBox="0 0 26 16" width="20" height="12"><path d="'+w.path+'" fill="none" stroke="#6EE7A0" stroke-width="1.6"/></svg><span>'+w.label+'</span><span class="cyc-hint">&#8635;</span>';
}
function renderFilterBtn(){
  const f = FILTER_TYPES.find(x => x.key === params.filterType) || FILTER_TYPES[0];
  $('filterBtn').innerHTML = '<span>'+f.label+'</span><span class="cyc-hint">&#8635;</span>';
}
$('styleBtn').addEventListener('click', () => {
  const idx = SYNTH_STYLES.findIndex(x => x.key === params.synthStyle);
  params.synthStyle = SYNTH_STYLES[(idx+1) % SYNTH_STYLES.length].key;
  renderStyleBtn();
  if (params.synthStyle !== 'flowing') cleanupMonoVoice();
});
$('waveBtn').addEventListener('click', () => {
  const idx = WAVEFORMS.findIndex(x => x.key === params.waveform);
  params.waveform = WAVEFORMS[(idx+1) % WAVEFORMS.length].key;
  renderWaveBtn();
  if (monoOsc) monoOsc.type = params.waveform;
});
$('filterBtn').addEventListener('click', () => {
  const idx = FILTER_TYPES.findIndex(x => x.key === params.filterType);
  params.filterType = FILTER_TYPES[(idx+1) % FILTER_TYPES.length].key;
  renderFilterBtn();
  if (filterNode) filterNode.type = params.filterType;
});

/* ================= UI sync ================= */
function syncUIToParams(){
  $('bpmSlider').value = params.bpm;
  $('bpmVal').textContent = params.bpm;

  $('mixSlider').value = Math.round(params.mix*100);
  $('mixVal').textContent = Math.round(params.mix*100);

  renderStyleBtn();
  renderWaveBtn();
  renderFilterBtn();

  const cutoffPct = Math.round(100 * (Math.log(params.cutoff/200) / Math.log(16000/200)));
  $('cutoffSlider').value = clamp(cutoffPct,0,100);
  $('cutoffVal').textContent = Math.round(params.cutoff);
  $('resSlider').value = Math.round(params.resonance*10);
  $('resVal').textContent = params.resonance.toFixed(1);

  $('wSynth').value = Math.round(params.wSynth*100);
  $('wKick').value = Math.round(params.wKick*100);
  $('wSnare').value = Math.round(params.wSnare*100);
  $('wHihat').value = Math.round(params.wHihat*100);
  $('sensSlider').value = Math.round(params.sensitivity*100);
  $('sensVal').textContent = Math.round(params.sensitivity*100);
}

/* ================= controls wiring ================= */
$('bpmSlider').addEventListener('input', e => {
  params.bpm = parseInt(e.target.value,10);
  $('bpmVal').textContent = params.bpm;
});
$('bpmSlider').addEventListener('change', () => {
  if (isPlaying) restartOrigSource();
});

$('mixSlider').addEventListener('input', e => {
  params.mix = parseInt(e.target.value,10)/100;
  $('mixVal').textContent = Math.round(params.mix*100);
  applyMixGains();
});

$('cutoffSlider').addEventListener('input', e => {
  const pct = parseInt(e.target.value,10);
  params.cutoff = 200 * Math.pow(16000/200, pct/100);
  $('cutoffVal').textContent = Math.round(params.cutoff);
  if (filterNode) filterNode.frequency.setTargetAtTime(params.cutoff, audioCtx.currentTime, 0.01);
});
$('resSlider').addEventListener('input', e => {
  params.resonance = parseInt(e.target.value,10)/10;
  $('resVal').textContent = params.resonance.toFixed(1);
  if (filterNode) filterNode.Q.setTargetAtTime(params.resonance, audioCtx.currentTime, 0.01);
});

function wireWeight(id, key){
  $(id).addEventListener('input', e => {
    params[key] = parseInt(e.target.value,10)/100;
  });
}
wireWeight('wSynth','wSynth'); wireWeight('wKick','wKick'); wireWeight('wSnare','wSnare'); wireWeight('wHihat','wHihat');

$('sensSlider').addEventListener('input', e => {
  params.sensitivity = parseInt(e.target.value,10)/100;
  $('sensVal').textContent = Math.round(params.sensitivity*100);
  if (lastAnalysis){
    steps = buildStepsFromAnalysis(lastAnalysis, stepCount);
  }
});

/* ================= synth engine ================= */
let synthBus = null, drumBus = null, origBus = null, filterNode = null, compressor = null, noiseBuffer = null;
function ensurePlaybackGraph(){
  if (synthBus) return;
  // Synth voice runs through the adjustable filter; drums and the original
  // recording both bypass it, so filter changes only reshape the synth.
  synthBus = audioCtx.createGain();
  synthBus.gain.value = params.mix;
  drumBus = audioCtx.createGain();
  drumBus.gain.value = 1;
  origBus = audioCtx.createGain();
  origBus.gain.value = 1 - params.mix;

  filterNode = audioCtx.createBiquadFilter();
  filterNode.type = params.filterType;
  filterNode.frequency.value = params.cutoff;
  filterNode.Q.value = params.resonance;

  compressor = audioCtx.createDynamicsCompressor();

  synthBus.connect(filterNode);
  filterNode.connect(compressor);
  drumBus.connect(compressor);
  origBus.connect(compressor);
  compressor.connect(audioCtx.destination);

  noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate*1, audioCtx.sampleRate);
  const d = noiseBuffer.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
}

function applyMixGains(){
  if (!synthBus || !origBus || !audioCtx) return;
  const t = audioCtx.currentTime;
  synthBus.gain.cancelScheduledValues(t);
  origBus.gain.cancelScheduledValues(t);
  synthBus.gain.setTargetAtTime(params.mix, t, 0.02);
  origBus.gain.setTargetAtTime(1 - params.mix, t, 0.02);
}

function playKick(time, velocity, weight){
  const osc = audioCtx.createOscillator(); osc.type='sine';
  const g = audioCtx.createGain();
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(42, time+0.15);
  const peak = clamp(velocity*weight, 0.001, 1);
  g.gain.setValueAtTime(peak, time);
  g.gain.exponentialRampToValueAtTime(0.001, time+0.22);
  osc.connect(g); g.connect(drumBus);
  osc.start(time); osc.stop(time+0.24);
}
function playSnare(time, velocity, weight){
  const noise = audioCtx.createBufferSource(); noise.buffer = noiseBuffer;
  const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=0.9;
  const ng = audioCtx.createGain();
  const peak = clamp(velocity*weight*0.8, 0.001, 1);
  ng.gain.setValueAtTime(peak, time);
  ng.gain.exponentialRampToValueAtTime(0.001, time+0.15);
  noise.connect(bp); bp.connect(ng); ng.connect(drumBus);
  noise.start(time); noise.stop(time+0.16);

  const osc = audioCtx.createOscillator(); osc.type='triangle'; osc.frequency.value=190;
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(clamp(velocity*weight*0.5,0.001,1), time);
  og.gain.exponentialRampToValueAtTime(0.001, time+0.1);
  osc.connect(og); og.connect(drumBus);
  osc.start(time); osc.stop(time+0.11);
}
function playHihat(time, velocity, weight){
  const noise = audioCtx.createBufferSource(); noise.buffer = noiseBuffer;
  const hp = audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7500;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(clamp(velocity*weight*0.5,0.001,1), time);
  g.gain.exponentialRampToValueAtTime(0.001, time+0.05);
  noise.connect(hp); hp.connect(g); g.connect(drumBus);
  noise.start(time); noise.stop(time+0.06);
}
function playSynthNote(time, midi, velocity, weight, dur){
  // percussive pluck: quick attack, steady decay across the step
  const osc = audioCtx.createOscillator(); osc.type = params.waveform;
  osc.frequency.value = midiToFreq(midi);
  const peak = clamp(velocity*weight*0.5*synthLoudnessGain(), 0.02, 0.9);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(peak, time+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, time + Math.max(0.05, dur*0.92));
  osc.connect(g); g.connect(synthBus);
  osc.start(time); osc.stop(time + dur);
}

/* ---- mono "flowing" bass/lead voice: a single persistent oscillator so
   only one note ever sounds at a time, gliding between pitches instead
   of stacking overlapping tones ---- */
let monoOsc = null, monoGain = null;
function ensureMonoVoice(){
  if (monoOsc) return;
  monoOsc = audioCtx.createOscillator();
  monoOsc.type = params.waveform;
  monoGain = audioCtx.createGain();
  monoGain.gain.value = 0.0001;
  monoOsc.connect(monoGain);
  monoGain.connect(synthBus);
  monoOsc.start();
}
function cleanupMonoVoice(){
  if (monoOsc){ try{ monoOsc.stop(); }catch(e){} try{ monoOsc.disconnect(); }catch(e){} }
  if (monoGain){ try{ monoGain.disconnect(); }catch(e){} }
  monoOsc = null; monoGain = null;
}
function scheduleMonoNote(idx, time){
  const st = steps[idx];
  const prevIdx = (idx - 1 + stepCount) % stepCount;
  const prevSt = steps[prevIdx];
  const wasRinging = !!(prevSt && prevSt.nOn && prevSt.note);
  const stepDur = secondsPerStep();
  const glideTime = Math.min(stepDur*0.02, 0.004);

  if (st.nOn && st.note){
    ensureMonoVoice();
    const freq = midiToFreq(st.note.midi - 12);
    const peak = clamp(Math.max(st.note.vel,0.55) * params.wSynth * 0.55 * synthLoudnessGain(), 0.02, 0.9);
    monoGain.gain.cancelScheduledValues(time);
    monoOsc.frequency.cancelScheduledValues(time);
    if (wasRinging){
      // legato: glide from the previous pitch straight into this one
      monoOsc.frequency.exponentialRampToValueAtTime(freq, time+glideTime);
      monoGain.gain.setTargetAtTime(peak, time, 0.02);
    } else {
      // fresh attack out of silence
      monoOsc.frequency.setValueAtTime(freq, time);
      monoGain.gain.setValueAtTime(0.0001, time);
      monoGain.gain.exponentialRampToValueAtTime(peak, time+0.04);
    }
  } else if (wasRinging && monoGain){
    // this step is a rest right after a ringing note: let it go
    monoGain.gain.cancelScheduledValues(time);
    monoGain.gain.setTargetAtTime(0.0001, time, 0.06);
  }
}

/* ---- scheduler ---- */
let isPlaying = false;
let nextNoteTime = 0;
let currentStepIndex = 0;
let schedulerTimer = null;
const LOOKAHEAD = 0.1, INTERVAL = 25;

function secondsPerStep(){ return (240/params.bpm) / stepCount; }

/* "Phrased" style: instead of every note being a uniform marching-16ths
   pluck, give each step a note length that varies -- some short, some
   held out over several steps. The variation is derived from a stable
   hash of the step index and pitch (not re-rolled every playback), so
   the same phrase repeats consistently bar to bar rather than jittering,
   while still landing differently across the pattern -- some notes read
   as quick stabs, others as longer held tones. */
function phrasedNoteDuration(idx, st){
  const stepDur = secondsPerStep();
  const midi = (st.note && st.note.midi) || 0;
  const seed = Math.abs(Math.sin(idx*12.9898 + midi*78.233)) % 1;
  const vel = (st.note && st.note.vel) || 0.5;
  const lengthFactor = 1 + seed*3.2 + vel*2; // roughly 1x to ~6x a step's length
  return stepDur * lengthFactor;
}

function scheduleStep(idx, time){
  const st = steps[idx];
  if (!st) return;
  if (params.synthStyle === 'flowing'){
    scheduleMonoNote(idx, time);
  } else if (st.nOn && st.note){
    const dur = params.synthStyle === 'phrased' ? phrasedNoteDuration(idx, st) : secondsPerStep()*1.6;
    playSynthNote(time, st.note.midi, Math.max(st.note.vel, 0.55), params.wSynth, dur);
  }
  if (st.kOn) playKick(time, Math.max(st.kick,0.6), params.wKick);
  if (st.sOn) playSnare(time, Math.max(st.snare,0.6), params.wSnare);
  if (st.hOn) playHihat(time, Math.max(st.hihat,0.6), params.wHihat);
}

function schedulerTick(){
  while (nextNoteTime < audioCtx.currentTime + LOOKAHEAD){
    scheduleStep(currentStepIndex, nextNoteTime);
    nextNoteTime += secondsPerStep();
    currentStepIndex = (currentStepIndex+1) % stepCount;
  }
}

let origSource = null;
let origSourceGain = null;
function startOrigSource(atTime){
  const fittedBuffer = buildFittedRecordedBuffer();
  if (!fittedBuffer) return;
  origSource = audioCtx.createBufferSource();
  origSource.buffer = fittedBuffer;
  origSource.loop = true;
  origSourceGain = audioCtx.createGain();
  origSourceGain.gain.value = 1;
  origSource.connect(origSourceGain);
  origSourceGain.connect(origBus);
  origSource.start(atTime);
}
function stopOrigSource(){
  if (!origSource) return;
  const src = origSource, g = origSourceGain;
  origSource = null; origSourceGain = null;
  if (g && audioCtx){
    // fade out fast before stopping so we don't cut the waveform mid-cycle
    const t = audioCtx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0.0001, t+0.012);
    try{ src.stop(t+0.015); }catch(e){}
    setTimeout(() => { try{ src.disconnect(); }catch(e){} try{ g.disconnect(); }catch(e){} }, 60);
  } else {
    try{ src.stop(); }catch(e){}
    try{ src.disconnect(); }catch(e){}
  }
}

function startPlayback(){
  if (isPlaying || !audioCtx) return;
  ensurePlaybackGraph();
  if (audioCtx.state==='suspended') audioCtx.resume();
  isPlaying = true;
  currentStepIndex = 0;
  nextNoteTime = audioCtx.currentTime + 0.05;
  schedulerTimer = setInterval(schedulerTick, INTERVAL);
  $('playBtn').innerHTML = '&#9632;';
  startOrigSource(nextNoteTime);
}
function stopPlayback(){
  isPlaying = false;
  if (schedulerTimer) clearInterval(schedulerTimer);
  $('playBtn').innerHTML = '&#9654;';
  cleanupMonoVoice();
  stopOrigSource();
}
$('playBtn').addEventListener('click', () => { isPlaying ? stopPlayback() : startPlayback(); });

function restartOrigSource(){
  if (!audioCtx || !origBus) return;
  stopOrigSource();
  startOrigSource(audioCtx.currentTime + 0.02);
}


})();
</script>
